<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Divine Temple Experience</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    color: white;
    overflow-x: hidden;
}

/* Background */
.bg {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: -2;
}
.bg img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    animation: slide 30s infinite;
    filter: brightness(0.5);
}

.bg img:nth-child(1){animation-delay:0s;}
.bg img:nth-child(2){animation-delay:5s;}
.bg img:nth-child(3){animation-delay:10s;}
.bg img:nth-child(4){animation-delay:15s;}
.bg img:nth-child(5){animation-delay:20s;}
.bg img:nth-child(6){animation-delay:25s;}

@keyframes slide {
0%{opacity:0;}
10%{opacity:1;}
30%{opacity:1;}
40%{opacity:0;}
100%{opacity:0;}
}

/* Overlay */
.overlay {
position: fixed;
width: 100%;
height: 100%;
background: linear-gradient(rgba(0,0,0,0.7), rgba(60,20,0,0.9));
z-index: -1;
}

/* Header */
.header {
text-align: center;
padding: 20px;
font-size: 32px;
color: gold;
text-shadow: 0px 0px 15px gold;
}

/* Cards */
.container {
display: flex;
flex-wrap: wrap;
justify-content: center;
gap: 25px;
padding: 20px;
}

.card {
width: 270px;
background: rgba(255, 215, 0, 0.12);
backdrop-filter: blur(15px);
border-radius: 20px;
padding: 15px;
text-align: center;
transition: 0.4s;
border: 1px solid gold;
}

.card:hover {
transform: scale(1.07);
box-shadow: 0px 0px 30px gold;
}

.card img {
width: 100%;
height: 170px;
border-radius: 12px;
object-fit: cover;
}

/* Button */
button {
margin-top: 12px;
padding: 10px 20px;
background: linear-gradient(to right, gold, orange);
border: none;
border-radius: 10px;
cursor: pointer;
font-weight: bold;
}

/* Sloka */
.sloka {
text-align: center;
margin: 30px;
color: gold;
font-style: italic;
}
</style>
</head>

<body>

<!-- Background -->
<div class="bg">
<img src="tirupati.jpg">
<img src="srisailam.jpg">
<img src="kanaka.jpg">
<img src="simhachalam.jpg">
<img src="annavaram.jpg">
<img src="yaganti.jpg">
</div>

<div class="overlay"></div>

<div class="header">🛕 Divine Temple Experience</div>

<!-- Temple Cards -->
<div class="container">

<div class="card">
<img src="tirupati.jpg">
<h3>Tirupati</h3>
<button onclick="goToTemple('tirupati.html')">View</button>
</div>

<div class="card">
<img src="srisailam.jpg">
<h3>Srisailam</h3>
<button onclick="goToTemple('srisailam.html')">View</button>
</div>

<div class="card">
<img src="kanaka.jpg">
<h3>Kanaka Durga</h3>
<button onclick="goToTemple('kanaka.html')">View</button>
</div>

<div class="card">
<img src="simhachalam.jpg">
<h3>Simhachalam</h3>
<button onclick="goToTemple('simhachalam.html')">View</button>
</div>

<div class="card">
<img src="annavaram.jpg">
<h3>Annavaram</h3>
<button onclick="goToTemple('annavaram.html')">View</button>
</div>

<div class="card">
<img src="yaganti.jpg">
<h3>Yaganti</h3>
<button onclick="goToTemple('yaganti.html')">View</button>
</div>

</div>

<!-- Sloka -->
<div class="sloka">
"Om Namo Venkatesaya 🙏"
</div>

<!-- Audio -->
<audio id="chant" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<button onclick="toggleMusic()" style="position:fixed;bottom:20px;right:20px;">
🔊
</button>

<script>

// Navigation
function goToTemple(page){
window.location.href = page;
}

// Music
function toggleMusic(){
let a=document.getElementById("chant");
a.paused?a.play():a.pause();
}

</script>

</body>
</html>
